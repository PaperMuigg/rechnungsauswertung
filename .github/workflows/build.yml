name: Windows-EXE bauen
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pyinstaller --onefile --noconsole --name Rechnungsauswertung rechnungsauswertung.py
      - uses: actions/upload-artifact@v4
        with:
          name: Rechnungsauswertung
          path: dist/Rechnungsauswertung.exe
